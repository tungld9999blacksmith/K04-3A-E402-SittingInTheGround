<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScriptScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="src/tokens.css">
<link rel="stylesheet" href="src/app.css">
</head>
<body>

<div class="app">
  <header class="top">
    <button class="back" id="back" hidden aria-label="Quay lai danh sach kich ban" title="Quay lai danh sach">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 3.5L5.5 9l5.5 5.5"/></svg>
    </button>
    <img src="src/vinuni-logo.png" alt="VinUniversity" width="24" height="24">
    <span class="nm">ScriptScout</span>
    <span class="crumb" id="crumb"></span>
    <div class="right">
      <span class="mode" id="mode">dữ liệu mẫu</span>
      <span class="meta num" id="cost">Bản mô phỏng</span>
    </div>
  </header>

  <div class="cols">
    <nav class="rail" id="rail" aria-label="Cấu trúc"></nav>

    <div class="mid" id="mid">
      <main class="thread" id="thread" aria-live="polite"></main>
      <div class="list" id="list" hidden></div>
      <div class="composer">
        <div class="wrap">
          <div class="chips" id="chips"></div>
          <div class="in">
            <label class="sr" for="say">Nhắn cho agent</label>
            <textarea id="say" rows="1" placeholder="Nhắn cho agent, hoặc bấm / để vào ô này"></textarea>
            <button class="btn pri" id="send">Gửi</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="inspect" id="inspect" aria-label="Chi tiết"></aside>
  </div>
</div>

<script src="src/fixture.js"></script>
<script src="src/state.js"></script>
<script src="src/adapter-mock.js"></script>
<script src="src/adapter-http.js"></script>
<script src="src/adapter.js"></script>
<script src="src/export.js"></script>
<script src="src/views.js"></script>
<script src="src/app.js"></script>
</body>
</html>
